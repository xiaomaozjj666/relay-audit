[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relay-audit"
version = "2.0.0"
description = "OpenAI-compatible 中转 API 检测工具 — 安全、质量、身份验证审计"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "relay-audit contributors" }]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "rich>=13.0",
]

[project.scripts]
relay-audit = "relay_audit.cli:main"

[tool.setuptools.packages.find]
include = ["relay_audit*"]
