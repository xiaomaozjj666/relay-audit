[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relay-audit"
version = "2.3.8"
description = "OpenAI-compatible 中转 API 检测工具 — 安全、质量、身份验证审计"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "relay-audit contributors" }]
requires-python = ">=3.10"
keywords = [
    "openai",
    "api-audit",
    "relay-api",
    "api-gateway",
    "llm",
    "security-audit",
    "api-quality",
    "api-key-safety",
    "model-identity",
    "penetration-testing",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "httpx>=0.27,<1.0",
    "rich>=13.0,<16.0",
    "typing-extensions>=4.6,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
    "pytest-cov>=5.0,<8",
    "pytest-asyncio>=0.24",
    "ruff>=0.16,<0.18",
    "mypy>=1.10,<3",
    # Python 3.10 没有 tomllib，tests/test_package.py 回退到 tomli
    "tomli>=1.1.0; python_version < \"3.11\"",
]

[project.urls]
Homepage = "https://github.com/xiaomaozjj666/relay-audit"
Repository = "https://github.com/xiaomaozjj666/relay-audit"
Issues = "https://github.com/xiaomaozjj666/relay-audit/issues"

[project.scripts]
relay-audit = "relay_audit.cli:main"
relay-audit-calibrate = "relay_audit.calibrate:main"
relay-audit-benchmark = "relay_audit.benchmark:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]
# ruff 0.16 起默认规则集大幅扩充，以下三类与本工具的设计刻意冲突，显式豁免：
# - BLE001：探测不可信中转端点，任何异常都要捕获、报错并继续扫描（记录后继续是核心模式）
# - DTZ005：报告时间戳/文件名/清理基线刻意用本地时间，面向使用者展示
# - TRY004：规则与配置文件的非法输入沿用 ValueError，是面向用户的报错语义
ignore = ["BLE001", "DTZ005", "TRY004"]

# E402: __init__.py 需要先定义 REPORTS_DIR 再导入子模块（规避循环导入）；
#       test_scanner.py 在文件中部引入 httpx/ApiClient 供用例复用。
[tool.ruff.lint.per-file-ignores]
"relay_audit/__init__.py" = ["E402"]
"tests/test_scanner.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.setuptools.packages.find]
include = ["relay_audit*"]

[tool.setuptools.package-data]
relay_audit = ["data/*.json"]
