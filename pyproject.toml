[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relay-audit"
version = "2.1.0"
description = "OpenAI-compatible 中转 API 检测工具 — 安全、质量、身份验证审计。对标 api-relay-audit 架构"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "relay-audit contributors" }]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1.0",
    "rich>=13.0,<14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/xiaomaozjj666/relay-audit"
Repository = "https://github.com/xiaomaozjj666/relay-audit"
Issues = "https://github.com/xiaomaozjj666/relay-audit/issues"

[project.scripts]
relay-audit = "relay_audit.cli:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.setuptools.packages.find]
include = ["relay_audit*"]
