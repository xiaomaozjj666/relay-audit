[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relay-audit"
version = "2.3.5"
description = "OpenAI-compatible 中转 API 检测工具 — 安全、质量、身份验证审计"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "relay-audit contributors" }]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1.0",
    "rich>=13.0,<14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.15,<0.16",
    "mypy>=1.10,<2",
]

[project.urls]
Homepage = "https://github.com/xiaomaozjj666/relay-audit"
Repository = "https://github.com/xiaomaozjj666/relay-audit"
Issues = "https://github.com/xiaomaozjj666/relay-audit/issues"

[project.scripts]
relay-audit = "relay_audit.cli:main"
relay-audit-calibrate = "relay_audit.calibrate:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

# E402: __init__.py 需要先定义 REPORTS_DIR 再导入子模块（规避循环导入）；
#       test_scanner.py 在文件中部引入 httpx/ApiClient 供用例复用。
[tool.ruff.lint.per-file-ignores]
"relay_audit/__init__.py" = ["E402"]
"tests/test_scanner.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.setuptools.packages.find]
include = ["relay_audit*"]

[tool.setuptools.package-data]
relay_audit = ["data/*.json"]
