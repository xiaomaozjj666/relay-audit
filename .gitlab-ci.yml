stages:
  - lint
  - test

default:
  image: python:3.12-slim
  interruptible: true
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - .cache/pip
  before_script:
    - python -m pip install --upgrade pip
    - pip install -r requirements-dev.txt
    - pip install -e .

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

ruff:
  stage: lint
  script:
    - ruff check .
    - ruff format --check .

mypy:
  stage: lint
  script:
    - mypy relay_audit

test:
  stage: test
  script:
    - pytest --cov=relay_audit --cov-report=term --cov-report=xml
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
