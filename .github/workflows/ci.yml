name: CI

permissions:
  contents: read

on:
  push:
  pull_request:

# 仅对 PR 取消旧运行（PR 分支会反复推送，取消可避免排队）；
# 推送默认分支不取消——公开仓库的 Actions 分钟数免费，取消节省不了额度，
# 反而会让被顶掉的那次运行在提交列表里留下红色的 cancelled 标记。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 开发依赖以 pyproject.toml 的 [project.optional-dependencies].dev 为唯一来源
          pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy relay_audit

  test:
    strategy:
      # 兼容性问题需要完整暴露，单个版本失败不取消其余矩阵项
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          # 工具重度面向 Windows 使用场景（.bat 入口/icacls 权限/报告目录
          # 在 %LOCALAPPDATA%），补一个 Windows 验证点
          - os: windows-latest
            python-version: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 开发依赖以 pyproject.toml 的 [project.optional-dependencies].dev 为唯一来源
          pip install -e ".[dev]"
      - name: Run tests
        # 覆盖率门禁只在基准组合（ubuntu + 3.12）执行，其余矩阵项只跑测试
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: pytest --cov=relay_audit --cov-report=term --cov-report=xml --cov-fail-under=95
      - name: Run tests
        if: matrix.os != 'ubuntu-latest' || matrix.python-version != '3.12'
        run: pytest -q
